<!--
  Source for public/cam-03-after.jpg — the rectification frame that pairs with cam-03.jpg
  on the patrol demo.

  cam-03 is the corridor with someone mid-way along it. This is the same camera once
  the corridor is clear.
  Same geometry, same grade, same artefacts as the "before" frame, so the pair reads as
  two moments on one camera rather than two different scenes. Synthesised, not
  photographed: there is no third-party copyright attached to it.

  Regenerate:
    CHROME="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
    "$CHROME" --headless=new --disable-gpu --hide-scrollbars \
      --window-size=640,360 --force-device-scale-factor=2 \
      --screenshot=/tmp/after.png \
      "file://$PWD/scripts/assets/camera-frame-corridor-after.html"
  Then resize to 480x270 and save as public/cam-03-after.jpg.
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; }
  .cam { position:relative; width:640px; height:360px; overflow:hidden; background:#0a0c0e; }
  .scene { position:absolute; inset:0; }
  .grain {
    position:absolute; inset:0; opacity:.28; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='0.55'/></svg>");
  }
  .scan { position:absolute; inset:0; opacity:.20;
    background:repeating-linear-gradient(180deg, rgba(0,0,0,.55) 0 1px, transparent 1px 3px); }
  .vig { position:absolute; inset:0;
    background:radial-gradient(ellipse 78% 68% at 50% 45%, transparent 52%, rgba(0,0,0,.5) 100%); }
  .ir { filter:saturate(.25) sepia(1) hue-rotate(66deg) saturate(2.2) brightness(1.55) contrast(1.15); }
  svg { position:absolute; inset:0; width:100%; height:100%; display:block; }
</style>

<div class="cam">
  <div class="scene ir">
    <svg viewBox="0 0 640 360" preserveAspectRatio="none">
      <rect width="640" height="360" fill="#0e1512"/>
      <polygon points="0,0 200,132 200,238 0,360" fill="#182420"/>
      <polygon points="640,0 440,132 440,238 640,360" fill="#141e1a"/>
      <polygon points="0,360 640,360 440,238 200,238" fill="#111a16"/>
      <polygon points="0,0 640,0 440,132 200,132" fill="#1b2823"/>
      <rect x="200" y="132" width="240" height="106" fill="#0a100d"/>
      <g fill="#0d1512">
        <polygon points="40,86 96,124 96,268 40,306"/>
        <polygon points="120,138 160,164 160,232 120,258"/>
      </g>
      <g fill="#3f5c4c" opacity=".55">
        <polygon points="250,26 390,26 372,52 268,52"/>
        <polygon points="286,74 354,74 346,90 294,90"/>
      </g>
    </svg>
  </div>
  <div class="grain"></div><div class="scan"></div><div class="vig"></div>
</div>
