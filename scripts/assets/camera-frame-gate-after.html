<!--
  Source for public/cam-06-after.jpg — the rectification frame that pairs with
  cam-06.jpg on the patrol demo.

  cam-06 is the gate standing part open with someone walking through. This is the same
  camera after the guard has closed it: the sliding gate runs the full span and the
  subject has gone. Same geometry, same grade, same artefacts, so the pair reads as two
  moments on one camera rather than two different scenes.

  Regenerate:
    CHROME="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
    "$CHROME" --headless=new --disable-gpu --hide-scrollbars \
      --window-size=640,360 --force-device-scale-factor=2 \
      --screenshot=/tmp/gate-after.png \
      "file://$PWD/scripts/assets/camera-frame-gate-after.html"
  Then resize to 480x270 and save as public/cam-06-after.jpg.
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; }
  .cam { position:relative; width:640px; height:360px; overflow:hidden; background:#0a0c0e; }
  .scene { position:absolute; inset:0; }
  .grain {
    position:absolute; inset:0; opacity:.28; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='0.55'/></svg>");
  }
  .scan { position:absolute; inset:0; opacity:.20;
    background:repeating-linear-gradient(180deg, rgba(0,0,0,.55) 0 1px, transparent 1px 3px); }
  .vig { position:absolute; inset:0;
    background:radial-gradient(ellipse 78% 68% at 50% 45%, transparent 52%, rgba(0,0,0,.5) 100%); }
  .ir { filter:saturate(.25) sepia(1) hue-rotate(66deg) saturate(2.2) brightness(1.55) contrast(1.15); }
  svg { position:absolute; inset:0; width:100%; height:100%; display:block; }
</style>

<div class="cam">
  <div class="scene ir">
    <svg viewBox="0 0 640 360" preserveAspectRatio="none">
      <rect width="640" height="360" fill="#0d1411"/>
      <polygon points="0,360 640,360 640,206 0,236" fill="#16201b"/>
      <!-- gate posts -->
      <rect x="86" y="96" width="20" height="150" fill="#28362e"/>
      <rect x="524" y="100" width="20" height="140" fill="#28362e"/>
      <rect x="86" y="96" width="458" height="14" fill="#2c3b32"/>
      <!-- sliding gate drawn across the full span: closed -->
      <g stroke="#2a3830" stroke-width="4">
        <line x1="106" y1="118" x2="106" y2="240"/><line x1="150" y1="118" x2="150" y2="238"/>
        <line x1="194" y1="118" x2="194" y2="236"/><line x1="238" y1="118" x2="238" y2="234"/>
        <line x1="282" y1="118" x2="282" y2="232"/><line x1="326" y1="118" x2="326" y2="231"/>
        <line x1="370" y1="118" x2="370" y2="229"/><line x1="414" y1="118" x2="414" y2="227"/>
        <line x1="458" y1="118" x2="458" y2="226"/><line x1="502" y1="118" x2="502" y2="224"/>
        <line x1="106" y1="150" x2="502" y2="148"/><line x1="106" y1="205" x2="502" y2="200"/>
      </g>
      <!-- meeting edge where the leaf closes against the far post -->
      <rect x="506" y="112" width="7" height="114" fill="#314238"/>
      <!-- bollards, unchanged -->
      <g fill="#243128"><rect x="330" y="238" width="10" height="34" rx="4"/><rect x="484" y="236" width="10" height="34" rx="4"/></g>
    </svg>
  </div>
  <div class="grain"></div><div class="scan"></div><div class="vig"></div>
</div>
