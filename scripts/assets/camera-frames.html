<!--
  Source for the hero camera frames (public/cam-01.jpg … cam-06.jpg).

  These are synthesised, not photographed and not licensed from anywhere: perspective
  geometry in SVG, an IR or low-light colour grade, then grain, scanlines and a vignette.
  Deliberately stylised — they read as camera feeds without being mistakable for footage
  from a real customer site, and there is no third-party copyright attached to them.

  Scenes, in grid order: perimeter fence · loading dock · corridor · parking lot ·
  warehouse aisle · gate. Each maps to a camera location in the hero grid, so a tile
  labelled PARKING LOT A shows a parking lot.

  To regenerate after editing:

    CHROME="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
    "$CHROME" --headless=new --disable-gpu --hide-scrollbars \
      --window-size=1280,1080 --force-device-scale-factor=2 \
      --screenshot=/tmp/sheet.png "file://$PWD/scripts/assets/camera-frames.html"

  Then slice the 2x3 sheet into 480x270 JPEGs at public/cam-NN.jpg — cells are
  1280x720 in the capture, ordered left-to-right, top-to-bottom.
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; }
  .sheet { display:grid; grid-template-columns:repeat(2, 640px); gap:0; }
  .cam { position:relative; width:640px; height:360px; overflow:hidden; background:#0a0c0e; }
  .scene { position:absolute; inset:0; }

  /* ---- shared camera artefacts ---- */
  .grain {
    position:absolute; inset:0; opacity:.28; mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)' opacity='0.55'/></svg>");
  }
  .scan {
    position:absolute; inset:0; opacity:.20;
    background:repeating-linear-gradient(180deg, rgba(0,0,0,.55) 0 1px, transparent 1px 3px);
  }
  .vig {
    position:absolute; inset:0;
    background:radial-gradient(ellipse 78% 68% at 50% 45%, transparent 52%, rgba(0,0,0,.5) 100%);
  }
  .blur { position:absolute; inset:0; backdrop-filter:blur(.6px); }

  /* IR night vision */
  .ir { filter:saturate(.25) sepia(1) hue-rotate(66deg) saturate(2.2) brightness(1.55) contrast(1.15); }
  /* low-light colour */
  .dim { filter:saturate(.7) brightness(1.9) contrast(1.28); }

  svg { position:absolute; inset:0; width:100%; height:100%; display:block; }
</style>

<div class="sheet">

  <!-- 1 · PERIMETER FENCE, IR -->
  <div class="cam">
    <div class="scene ir">
      <svg viewBox="0 0 640 360" preserveAspectRatio="none">
        <defs><linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#1b2a24"/><stop offset="1" stop-color="#0b120f"/></linearGradient></defs>
        <rect width="640" height="360" fill="url(#sky1)"/>
        <!-- ground plane -->
        <polygon points="0,360 640,360 640,196 0,232" fill="#16211c"/>
        <!-- fence line receding -->
        <polygon points="60,300 620,206 620,196 60,272" fill="#24332c"/>
        <g stroke="#2e4038" stroke-width="3">
          <line x1="70" y1="300" x2="70" y2="196"/><line x1="180" y1="282" x2="180" y2="190"/>
          <line x1="290" y1="264" x2="290" y2="184"/><line x1="400" y1="246" x2="400" y2="180"/>
          <line x1="500" y1="228" x2="500" y2="176"/><line x1="590" y1="212" x2="590" y2="172"/>
        </g>
        <!-- mesh -->
        <g stroke="#22302a" stroke-width="1" opacity=".7">
          <line x1="60" y1="248" x2="620" y2="182"/><line x1="60" y1="262" x2="620" y2="190"/>
        </g>
        <!-- subject -->
        <ellipse cx="352" cy="292" rx="26" ry="10" fill="#0b100e" opacity=".7"/>
        <path d="M352 240c7 0 12 5 12 12 0 6-3 9-3 13l4 26h-7l-4-19-4 19h-7l4-26c0-4-3-7-3-13 0-7 5-12 12-12z" fill="#3c5a4c"/>
        <circle cx="352" cy="231" r="7.5" fill="#42624f"/>
      </svg>
    </div>
    <div class="grain"></div><div class="scan"></div><div class="vig"></div>
  </div>

  <!-- 2 · LOADING DOCK -->
  <div class="cam">

      <svg viewBox="0 0 640 360" preserveAspectRatio="none">
        <rect width="640" height="360" fill="#14161a"/>
        <polygon points="0,360 640,360 640,214 0,238" fill="#1c1f24"/>
        <!-- dock wall -->
        <rect x="0" y="70" width="640" height="150" fill="#191c21"/>
        <!-- three bay doors -->
        <g>
          <rect x="46" y="98" width="150" height="122" fill="#101317"/>
          <rect x="52" y="104" width="138" height="110" fill="#22262c"/>
          <rect x="246" y="98" width="150" height="122" fill="#0d1014"/>
          <rect x="446" y="98" width="150" height="122" fill="#101317"/>
          <rect x="452" y="104" width="138" height="110" fill="#20242a"/>
        </g>
        <!-- open bay glow -->
        <rect x="252" y="104" width="138" height="110" fill="#2b2a22"/>
        <!-- bay numbering strips -->
        <g fill="#2e343c">
          <rect x="46" y="224" width="150" height="6"/><rect x="246" y="224" width="150" height="6"/>
          <rect x="446" y="224" width="150" height="6"/>
        </g>
        <!-- floor markings -->
        <g stroke="#3a4048" stroke-width="4" opacity=".8">

          <line x1="520" y1="248" x2="580" y2="360"/>
        </g>
        <!-- pallet -->
        <rect x="288" y="186" width="62" height="30" fill="#2a2721"/>
        <rect x="292" y="216" width="54" height="8" fill="#1d1b17"/>
      </svg>
    </div>
    <div class="grain"></div><div class="scan"></div><div class="vig"></div>
  </div>

  <!-- 3 · CORRIDOR, IR -->

        <polygon points="640,0 440,132 440,238 640,360" fill="#141e1a"/>
        <polygon points="0,360 640,360 440,238 200,238" fill="#111a16"/>

        <rect x="200" y="132" width="240" height="106" fill="#0a100d"/>

        <g fill="#0d1512">

    </div>
    <div class="grain"></div><div class="scan"></div><div class="vig"></div>
  </div>

        <rect width="640" height="150" fill="#171b21"/>
        <polygon points="0,360 640,360 640,150 0,150" fill="#1a1e24"/>
        <!-- bay lines in perspective -->
        <g stroke="#33393f" stroke-width="3" opacity=".85">

          <line x1="330" y1="360" x2="334" y2="168"/><line x1="490" y1="360" x2="426" y2="168"/>

        <g fill="#3a3a2c" opacity=".6"><ellipse cx="96" cy="58" rx="16" ry="5"/><ellipse cx="548" cy="64" rx="14" ry="5"/></g>

    <div class="grain"></div><div class="scan"></div><div class="vig"></div>

  <!-- 5 · WAREHOUSE AISLE -->
  <div class="cam">
    <div class="scene dim">
      <svg viewBox="0 0 640 360" preserveAspectRatio="none">
        <rect width="640" height="360" fill="#131519"/>
        <polygon points="0,360 640,360 452,214 188,214" fill="#191c21"/>
        <polygon points="0,0 188,214 188,120 0,0" fill="#1d2127"/>
        <!-- racking left -->
        <g fill="#22262d">
          <polygon points="0,40 176,150 176,214 0,300"/>

        <g fill="#2a2f37">
          <polygon points="20,96 168,168 168,186 20,132"/>

        <!-- racking right -->
        <g fill="#1e2229">

        <g fill="#262b33">

        <!-- boxes -->
        <g fill="#2f2a22">

        <!-- back wall + roller door -->

        <rect x="250" y="140" width="140" height="74" fill="#191d22"/>
        <!-- floor line -->
        <line x1="320" y1="214" x2="320" y2="360" stroke="#333a42" stroke-width="4" opacity=".7"/>

    </div>
    <div class="grain"></div><div class="scan"></div><div class="vig"></div>
  </div>

  <!-- 6 · GATE / ENTRANCE, IR -->
  <div class="cam">
    <div class="scene ir">
      <svg viewBox="0 0 640 360" preserveAspectRatio="none">
        <rect width="640" height="360" fill="#0d1411"/>
        <polygon points="0,360 640,360 640,206 0,236" fill="#16201b"/>
        <!-- gate posts -->
        <rect x="86" y="96" width="20" height="150" fill="#28362e"/>
        <rect x="524" y="100" width="20" height="140" fill="#28362e"/>
        <rect x="86" y="96" width="458" height="14" fill="#2c3b32"/>
        <!-- sliding gate, part open -->
        <g stroke="#2a3830" stroke-width="4">
          <line x1="106" y1="118" x2="106" y2="240"/><line x1="150" y1="118" x2="150" y2="238"/>

        <circle cx="420" cy="225" r="7.5" fill="#476b59"/>
        <!-- bollards -->

    </div>
    <div class="grain"></div><div class="scan"></div><div class="vig"></div>

</div>
